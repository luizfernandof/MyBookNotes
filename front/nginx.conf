# Atrás da Cloudflare, o IP real do visitante vem no header CF-Connecting-IP.
# Só é confiável se a porta do front aceitar conexões apenas da VM de apontamento.
map $http_cf_connecting_ip $client_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Dificulta ataques de força bruta contra login e cadastro
limit_req_zone $client_key zone=auth:10m rate=5r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve a API a cada requisição: o IP do container muda quando ela é recriada
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8080;

    proxy_set_header Host $host;
    proxy_hide_header X-Content-Type-Options;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src: APIs de capas chamadas pelo navegador. img-src: as capas vêm de vários domínios.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https://itunes.apple.com https://openlibrary.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $api_upstream;
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    # Os arquivos gerados pelo Vite têm hash no nome, então podem ficar em cache
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rotas do React: tudo o que não é arquivo devolve o index.html
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
