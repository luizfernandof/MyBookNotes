spring:
  application:
    name: mybooknotes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mybooknotes}
    username: ${DB_USERNAME:mybooknotes}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # O schema é criado pelas migrações do Flyway (db/migration); aqui só é conferido
      ddl-auto: validate
    open-in-view: false

jwt:
  # Obrigatório, com pelo menos 32 caracteres. Gere com: openssl rand -base64 48
  secret: ${JWT_SECRET:}
  issuer: mybooknotes
  access-token-ttl: 15m
  refresh-token-ttl: 7d
  # Remove do banco os refresh tokens expirados (padrão: todo dia às 3h)
  refresh-token-cleanup-cron: "0 0 3 * * *"
