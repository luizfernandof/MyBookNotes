spring:
  application:
    name: mybooknotes
  datasource:
    url: jdbc:h2:file:./data/mybooknotes
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # Obrigatório, com pelo menos 32 caracteres. Gere com: openssl rand -base64 48
  secret: ${JWT_SECRET:}
  issuer: mybooknotes
  access-token-ttl: 15m
  refresh-token-ttl: 7d
  # Remove do banco os refresh tokens expirados (padrão: todo dia às 3h)
  refresh-token-cleanup-cron: "0 0 3 * * *"
