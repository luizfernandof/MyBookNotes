# Só o banco, para desenvolver com a API rodando pelo ./mvnw
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mybooknotes
      POSTGRES_USER: mybooknotes
      POSTGRES_PASSWORD: mybooknotes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql

volumes:
  db-dev-data:
